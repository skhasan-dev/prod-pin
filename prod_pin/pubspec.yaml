publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_secure_storage: ^10.1.0
  get_it: ^9.2.1
  intl: ^0.20.2
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  dartz: ^0.10.1
  provider: ^6.1.5+1
  go_router: ^17.2.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_svg: ^2.3.0

dev_dependencies:
